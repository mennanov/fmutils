name: Linter

on: [ "push", "pull_request" ]

jobs:

  build:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Go vet
        run: go vet ./...
